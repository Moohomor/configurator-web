name: CI

on:
  push:
    # Работает на всех ветках
  pull_request:

jobs:
  typecheck-and-build:
    name: Type check and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      # Режим all: оба пакета из одного dist. Эквивалентен двум
      # отдельным вызовам (scorm, затем embed) и заодно покрывает
      # сам режим all — иначе он остался бы без проверки в CI.
      - name: Package SCORM and embed content
        run: node scripts/package-scorm.mjs all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist
            configurator-web-scorm2004.zip
            configurator-content.zip
          retention-days: 7

  e2e:
    name: Playwright (SCORM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run SCORM e2e tests
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
